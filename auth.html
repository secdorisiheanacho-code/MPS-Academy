<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPS Academy - Sign in</title>
<link rel="stylesheet" href="css/style.css">
<style>
*{box-sizing:border-box}
input,.main{width:100%;padding:12px;margin:6px 0;font-size:1rem}
.pw{position:relative}
.pw input{padding-right:76px}
.eye{position:absolute;right:8px;top:12px;padding:6px 10px;font-size:.9rem}
</style>
</head><body>
<h1>MPS Academy</h1>
<h2 id="title">Log in</h2>
<input id="name" placeholder="Your name" style="display:none">
<input id="email" type="email" placeholder="Email">
<div class="pw">
  <input id="password" type="password" placeholder="Password (6+ characters)">
  <button type="button" class="eye" id="eye">Show</button>
</div>
<button class="main" id="go">Log in</button>
<p id="msg"></p>
<p><a href="#" id="forgot">Forgot password?</a></p>
<p><a href="#" id="toggle">New here? Create an account</a></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let signup = false;
const $ = id => document.getElementById(id);
$("eye").onclick = () => {
  const show = $("password").type === "password";
  $("password").type = show ? "text" : "password";
  $("eye").textContent = show ? "Hide" : "Show";
};
$("toggle").onclick = e => {
  e.preventDefault(); signup = !signup;
  $("title").textContent = signup ? "Create your account" : "Log in";
  $("go").textContent = signup ? "Sign up" : "Log in";
  $("name").style.display = signup ? "block" : "none";
  $("toggle").textContent = signup ? "Have an account? Log in" : "New here? Create an account";
};
$("forgot").onclick = async e => {
  e.preventDefault();
  const email = $("email").value.trim();
  if (!email) { $("msg").textContent = "Type your email above first, then tap Forgot password."; return; }
  const { error } = await db.auth.resetPasswordForEmail(email, {
    redirectTo: new URL("reset.html", location.href).href
  });
  $("msg").textContent = error ? error.message : "If that email has an account, a reset link is on its way. Check your inbox and spam folder.";
};
$("go").onclick = async () => {
  const email = $("email").value.trim(), password = $("password").value;
  $("msg").textContent = "Please wait...";
  let res;
  if (signup) {
    res = await db.auth.signUp({ email, password, options: { data: { name: $("name").value.trim() } } });
  } else {
    res = await db.auth.signInWithPassword({ email, password });
  }
  if (res.error) { $("msg").textContent = res.error.message; return; }
  if (res.data.session) location.href = "dashboard.html";
  else $("msg").textContent = "Check your email to confirm your account.";
};
</script></body></html>
