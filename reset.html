<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPS Academy - Reset password</title>
<link rel="stylesheet" href="css/style.css">
<style>
*{box-sizing:border-box}
input,.main{width:100%;padding:12px;margin:6px 0;font-size:1rem}
.pw{position:relative}.pw input{padding-right:76px}
.eye{position:absolute;right:8px;top:12px;padding:6px 10px;font-size:.9rem}
</style>
</head><body>
<h1>MPS Academy</h1>
<h2>Choose a new password</h2>
<div class="pw">
  <input id="password" type="password" placeholder="New password (6+ characters)">
  <button type="button" class="eye" id="eye">Show</button>
</div>
<button class="main" id="save">Save new password</button>
<p id="msg"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
$("eye").onclick = () => {
  const show = $("password").type === "password";
  $("password").type = show ? "text" : "password";
  $("eye").textContent = show ? "Hide" : "Show";
};
$("save").onclick = async () => {
  const { error } = await db.auth.updateUser({ password: $("password").value });
  if (error) { $("msg").textContent = error.message; return; }
  $("msg").textContent = "Password updated. Taking you to your dashboard...";
  setTimeout(() => location.href = "dashboard.html", 1500);
};
</script></body></html>
